name: Vendor Supabase browser SDK

on:
  push:
    branches: [feature/vendor-supabase-library]
    paths:
      - ".github/workflows/vendor-supabase.yml"

permissions:
  contents: write

jobs:
  vendor-sdk:
    name: Download and verify official Supabase SDK
    runs-on: ubuntu-latest
    steps:
      - name: Check out the feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/vendor-supabase-library
          persist-credentials: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Download official npm package and verify browser build
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(npm view @supabase/supabase-js version)"
          test -n "$VERSION"
          TARBALL="$(npm pack "@supabase/supabase-js@$VERSION" --silent)"
          mkdir -p /tmp/farnaz-supabase-package
          tar -xzf "$TARBALL" -C /tmp/farnaz-supabase-package
          SOURCE="/tmp/farnaz-supabase-package/package/dist/umd/supabase.js"
          test -s "$SOURCE"
          grep -q "createClient" "$SOURCE"
          mkdir -p vendor
          cp "$SOURCE" vendor/supabase.js
          printf '%s\n' "$VERSION" > vendor/supabase-version.txt
          test -s vendor/supabase.js
          echo "Vendored @supabase/supabase-js@$VERSION ($(wc -c < vendor/supabase.js) bytes)"

      - name: Commit the verified SDK to the feature branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add vendor/supabase.js vendor/supabase-version.txt
          if git diff --cached --quiet; then
            echo "Vendor files are already current."
            exit 0
          fi
          git commit -m "Vendor verified Supabase browser SDK"
          git push origin HEAD:feature/vendor-supabase-library
